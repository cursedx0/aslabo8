name: one

on: 
  push:
    branches:
      - main

jobs:
  primero:
    runs-on: ubuntu-latest

    steps:
      - name: bajar codigo
        uses: actions/checkout@v4
      - name: autenticarse en dh
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DHUSERNAME }}
          password: ${{ secrets.DHTOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with: 
          push: true
          tags: cursedx0/aslabo8-web
          context: ./app
          
